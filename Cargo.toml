[package]
name = "gema-runtime"
version = "0.1.0"
edition = "2021"
authors = ["Gema Technologies Ltd"]
description = "Gema-native Linux runtime supervisor for GPU workspaces"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
